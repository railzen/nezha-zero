{{define "component/api"}}
<div class="ui tiny api modal transition hidden">
    <div class="header">{{tr "IssueNewApiToken"}}</div>
    <div class="content">
        <form id="apiForm" class="ui form">
            <input type="hidden" name="id">
            <div class="field">
                <label>{{tr "Note"}}</label>
                <input type="text" name="Note" autocomplete="off">
            </div>
            {{if .Conf.Site.TwoFactorSecret}}
            <div class="field">
                <label>{{tr "TwoFactorCode"}}</label>
                <input type="text" name="TwoFactorCode" placeholder="{{tr "TwoFactorCodePlaceholder"}}" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)">
            </div>
            {{end}}
        </form>
    </div>
    <div class="actions">
        <div class="ui negative button">{{tr "Cancel"}}</div>
        <button class="ui positive nezha-primary-btn right labeled icon button">{{tr "Confirm"}}<i class="checkmark icon"></i>
        </button>
    </div>
</div>
<div class="ui tiny issued-api-token modal transition hidden">
    <div class="header">{{tr "APITokenCreated"}}</div>
    <div class="content">
        <div class="ui warning message">{{tr "APITokenOnlyShownOnce"}}</div>
        <div class="ui fluid action input">
            <input type="text" name="IssuedToken" readonly autocomplete="off" spellcheck="false">
            <button type="button" class="ui icon button" onclick="copyIssuedApiToken(this)" data-tooltip="{{tr "ClickToCopy"}}">
                <i class="copy outline icon"></i>
            </button>
        </div>
    </div>
    <div class="actions">
        <button class="ui positive nezha-primary-btn button">{{tr "Confirm"}}</button>
    </div>
</div>
{{end}}
