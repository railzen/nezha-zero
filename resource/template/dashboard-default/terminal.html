{{define "dashboard-default/terminal"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const mobileTerminalDevice = navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Apple 平台粘贴用 Cmd+V，Ctrl+V 应保留给终端（如 vim 列选择）
        const appleTerminalDevice = navigator.userAgentData?.platform === 'macOS' ||
            /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
        if (mobileTerminalDevice) {
            document.documentElement.classList.add('mobile-terminal');
            document.querySelector('meta[name="viewport"]').content += ', interactive-widget=resizes-content';
        }
    </script>
    <title>tty@{{.ServerName}} - {{.Title}}</title>
    <link rel="shortcut icon" type="image/png" href="/static/logo.svg?v20210804" />
    <link type="text/css" rel="stylesheet" href="/static/cdn/xterm@5.5.0/css/xterm.css" />
</head>
<style>
    html,
    body,
    #terminal-container {
        padding: unset;
        margin: unset;
        width: 100%;
        height: 100%;
    }

    body {
        background-color: black;
    }

    html.mobile-terminal,
    html.mobile-terminal body,
    html.mobile-terminal #terminal-container {
        overflow: hidden;
        overscroll-behavior: none;
    }

    html.mobile-terminal #terminal-container .xterm-screen,
    html.mobile-terminal #terminal-container .xterm-screen canvas {
        pointer-events: none;
    }

    html.mobile-terminal #terminal-container .xterm-viewport {
        -webkit-overflow-scrolling: touch;
        -webkit-touch-callout: none;
        touch-action: pan-y;
    }

    #file-list-iframe {
        position: absolute;
        top: 0;
        right: 0;
        width: 30%;
        height: 100%;
        border: none;
        background-color: white;
        display: none;
        z-index: 10;
    }

    #folder-button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 20;
    }

    #terminal-keys {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        flex-wrap: nowrap;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
        background: #111;
        z-index: 30;
    }

    html.mobile-terminal #terminal-keys {
        display: flex;
        height: 36px;
    }

    html.mobile-terminal #terminal-container {
        position: fixed;
        top: 36px;
        bottom: 0;
        height: auto;
    }

    #terminal-keys button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 28px;
        box-sizing: border-box;
        padding: 0 2px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f3f3f3;
        color: #111;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    #terminal-keys button.active {
        background: #2563eb;
        border-color: #1d4ed8;
        color: #fff;
    }

    #terminal-copy-button {
        display: none;
        position: fixed;
        z-index: 40;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #f3f3f3;
        color: #111;
        font-size: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #terminal-copy-button.visible {
        display: block;
    }
</style>

<body onresize="onResize()">
    <div id="terminal-container"></div>
    <iframe id="file-list-iframe" name="file-list-iframe" src=""></iframe>
    <button id="folder-button">📁</button>
    <div id="terminal-keys">
        <button type="button" id="key-ctrl">Ctrl</button>
        <button type="button" data-key="escape">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="arrowLeft">←</button>
        <button type="button" data-key="arrowUp">↑</button>
        <button type="button" data-key="arrowDown">↓</button>
        <button type="button" data-key="arrowRight">→</button>
        <button type="button" data-key="home">Home</button>
        <button type="button" data-key="end">End</button>
    </div>
    <button type="button" id="terminal-copy-button">Copy</button>

    <script src="/static/cdn/xterm@5.5.0/lib/xterm.js"></script>
    <script src="/static/cdn/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="/static/cdn/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
    <script src="/static/cdn/@xterm/addon-attach@0.11.0/lib/addon-attach.js"></script>
    <script>
        let sendResizing = false;

        function doResize() {
            fitAddon.fit()

            const w = fitAddon.proposeDimensions();
            const prefix = new Int8Array([1]);
            const resizeMessage = new TextEncoder().encode(JSON.stringify({
                Rows: w.rows,
                Cols: w.cols,
            }));

            var msg = new Int8Array(prefix.length + resizeMessage.length);
            msg.set(prefix);
            msg.set(resizeMessage, prefix.length);

            socket.send(msg)
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function onResize() {
            if (sendResizing) return;
            sendResizing = true;
            try {
                await sleep(1500);
                doResize();
            } catch (error) {
                console.log('resize', error);
            } finally {
                sendResizing = false
            }
        }

        const KEY_SEQ = {
            escape: '\x1b',
            tab: '\t',
            arrowUp: '\x1b[A',
            arrowDown: '\x1b[B',
            arrowRight: '\x1b[C',
            arrowLeft: '\x1b[D',
            home: '\x1b[H',
            end: '\x1b[F',
        };
        const CTRL_KEY_SEQ = {
            arrowUp: '\x1b[1;5A',
            arrowDown: '\x1b[1;5B',
            arrowRight: '\x1b[1;5C',
            arrowLeft: '\x1b[1;5D',
            home: '\x1b[1;5H',
            end: '\x1b[1;5F',
        };
        const CTRL_PUNCTUATION = {
            ' ': 0, '@': 0, '[': 27, '\\': 28, ']': 29, '^': 30, '_': 31, '?': 127,
            '2': 0, '3': 27, '4': 28, '5': 29, '6': 30, '7': 31, '8': 127,
        };

        let controlActive = false;
        let lastKeyWasIME = false;

        function controlSequenceForInput(data) {
            if (data.length !== 1) return null;
            const code = data.toUpperCase().charCodeAt(0);
            if (code >= 65 && code <= 90) return String.fromCharCode(code - 64);
            const mapped = CTRL_PUNCTUATION[data];
            return mapped === undefined ? null : String.fromCharCode(mapped);
        }

        function setControlActive(active) {
            controlActive = active;
            const btn = document.getElementById('key-ctrl');
            btn.classList.toggle('active', active);
        }

        const term = new Terminal({
            screenKeys: true,
            useStyle: true,
            cursorBlink: true,
        });
        const socket = new WebSocket((window.location.protocol == 'https:' ? 'wss' : 'ws') + '://' + window.location.host + '/terminal/' + '{{.SessionID}}');

        const attachAddon = new AttachAddon.AttachAddon(socket);
        term.loadAddon(attachAddon);

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        term.attachCustomKeyEventHandler(function (ev) {
            if (ev.type !== 'keydown') return true;
            if (!appleTerminalDevice && ev.ctrlKey && !ev.shiftKey && !ev.altKey && !ev.metaKey &&
                (ev.key === 'v' || ev.key === 'V' || ev.keyCode === 86)) {
                return false;
            }
            if (!mobileTerminalDevice) return true;
            lastKeyWasIME = ev.keyCode === 229 || ev.key === 'Unidentified' || ev.key === 'Process';
            if (lastKeyWasIME) return false;
            if (controlActive && ev.key && ev.key.length === 1) {
                const sequence = controlSequenceForInput(ev.key);
                setControlActive(false);
                if (sequence !== null) {
                    if (socket.readyState === WebSocket.OPEN) socket.send(sequence);
                    return false;
                }
            }
            return true;
        });

        const terminalContainer = document.getElementById('terminal-container');
        term.open(terminalContainer);

        if (mobileTerminalDevice) {
            let mobileViewportFrame = 0;
            const revealMobileCursor = function () {
                cancelAnimationFrame(mobileViewportFrame);
                mobileViewportFrame = requestAnimationFrame(function () {
                    const viewportHeight = window.visualViewport
                        ? window.visualViewport.height
                        : window.innerHeight;
                    terminalContainer.style.height = Math.max(0, viewportHeight - 36) + 'px';
                    fitAddon.fit();

                    const buffer = term.buffer.active;
                    term.scrollToLine(buffer.baseY + buffer.cursorY);
                });
            };

            term.textarea.addEventListener('focus', revealMobileCursor);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function () {
                    revealMobileCursor();
                    onResize();
                });
            }
            revealMobileCursor();
        }

        (function () {
            const vp = terminalContainer.querySelector('.xterm-viewport');
            if (!vp) return;
            if (!mobileTerminalDevice) return;
            vp.addEventListener('touchstart', function (ev) { ev.stopPropagation(); }, { passive: true });
            vp.addEventListener('touchmove', function (ev) { ev.stopPropagation(); }, { passive: true });

            const copyButton = document.getElementById('terminal-copy-button');
            let longPressTimer = 0;
            let longPressStart = null;
            let selectedText = '';

            const hideCopyButton = function () {
                copyButton.classList.remove('visible');
            };
            const fallbackCopyText = function (text) {
                const copyArea = document.createElement('textarea');
                copyArea.value = text;
                copyArea.style.position = 'fixed';
                copyArea.style.opacity = '0';
                document.body.appendChild(copyArea);
                copyArea.select();
                document.execCommand('copy');
                document.body.removeChild(copyArea);
            };
            const copyText = function (text) {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).catch(function () {
                        fallbackCopyText(text);
                    });
                    return;
                }
                fallbackCopyText(text);
            };
            const getTerminalCell = function (x, y) {
                const screen = terminalContainer.querySelector('.xterm-screen');
                const rect = screen.getBoundingClientRect();
                return {
                    col: Math.max(0, Math.min(
                        term.cols - 1,
                        Math.floor((x - rect.left) / (rect.width / term.cols))
                    )),
                    row: term.buffer.active.viewportY + Math.max(0, Math.min(
                        term.rows - 1,
                        Math.floor((y - rect.top) / (rect.height / term.rows))
                    )),
                };
            };
            const selectToCell = function (cell) {
                const anchor = longPressStart.anchor;
                const anchorIndex = anchor.row * term.cols + anchor.col;
                const cellIndex = cell.row * term.cols + cell.col;
                if (cellIndex >= anchorIndex) {
                    term.select(anchor.col, anchor.row, cellIndex - anchorIndex + 1);
                } else {
                    term.select(cell.col, cell.row, anchorIndex - cellIndex + 1);
                }
            };
            const showCopyButton = function (x, y) {
                copyButton.classList.add('visible');
                const buttonRect = copyButton.getBoundingClientRect();
                copyButton.style.left = Math.max(8, Math.min(
                    x - buttonRect.width / 2,
                    window.innerWidth - buttonRect.width - 8
                )) + 'px';
                copyButton.style.top = Math.max(40, y - buttonRect.height - 12) + 'px';
            };

            vp.addEventListener('touchstart', function (ev) {
                hideCopyButton();
                clearTimeout(longPressTimer);
                if (ev.touches.length !== 1) return;

                const touch = ev.touches[0];
                longPressStart = { x: touch.clientX, y: touch.clientY, triggered: false };
                longPressTimer = setTimeout(function () {
                    if (!longPressStart) return;
                    longPressStart.triggered = true;
                    longPressStart.anchor = getTerminalCell(longPressStart.x, longPressStart.y);
                    selectToCell(longPressStart.anchor);
                }, 700);
            }, { passive: true });
            vp.addEventListener('touchmove', function (ev) {
                if (!longPressStart || ev.touches.length !== 1) return;
                const touch = ev.touches[0];
                if (longPressStart.triggered) {
                    ev.preventDefault();
                    selectToCell(getTerminalCell(touch.clientX, touch.clientY));
                    return;
                }
                if (Math.abs(touch.clientX - longPressStart.x) > 10 ||
                    Math.abs(touch.clientY - longPressStart.y) > 10) {
                    clearTimeout(longPressTimer);
                    longPressStart = null;
                }
            }, { passive: false });
            vp.addEventListener('touchend', function (ev) {
                clearTimeout(longPressTimer);
                if (longPressStart && longPressStart.triggered) {
                    ev.preventDefault();
                    selectedText = term.getSelection();
                    if (selectedText) {
                        const touch = ev.changedTouches[0];
                        showCopyButton(touch.clientX, touch.clientY);
                    }
                }
                longPressStart = null;
            }, { passive: false });
            vp.addEventListener('touchcancel', function () {
                clearTimeout(longPressTimer);
                longPressStart = null;
            }, { passive: true });
            copyButton.addEventListener('click', function () {
                if (selectedText) copyText(selectedText);
                hideCopyButton();
            });
        })();

        if (mobileTerminalDevice) {
            terminalContainer.addEventListener('input', function (ev) {
                if (!lastKeyWasIME || ev.target !== term.textarea || !ev.data) return;
                const type = ev.inputType || '';
                if (type !== 'insertText' && type !== 'insertCompositionText' &&
                    type !== 'insertReplacementText') return;
                if (type === 'insertCompositionText' && ev.isComposing) return;
                if (socket.readyState !== WebSocket.OPEN) return;

                let data = ev.data;
                if (controlActive) {
                    data = controlSequenceForInput(data) ?? data;
                    setControlActive(false);
                }
                socket.send(data);
                lastKeyWasIME = false;
                term.textarea.value = '';
                ev.stopImmediatePropagation();
            }, true);
        }

        socket.onopen = () => {
            onResize()
        }

        socket.onclose = () => {
            alert('{{tr "TerminalConnectionTimeOutOrSessionEnded"}}')
            window.close()
        }

        socket.onerror = () => {
            alert('{{tr "TerminalConnectionFailed"}}')
        }

        if (mobileTerminalDevice) {
            const keyBar = document.getElementById('terminal-keys');
            keyBar.addEventListener('mousedown', function (ev) { ev.preventDefault(); });

            document.getElementById('key-ctrl').addEventListener('click', function () {
                setControlActive(!controlActive);
                term.focus();
            });

            keyBar.addEventListener('click', function (ev) {
                const btn = ev.target.closest('button[data-key]');
                if (!btn || socket.readyState !== WebSocket.OPEN) return;
                const key = btn.getAttribute('data-key');
                const withControl = controlActive;
                setControlActive(false);
                socket.send((withControl && CTRL_KEY_SEQ[key]) || KEY_SEQ[key]);
                term.focus();
            });
        }

        // 处理文件夹按钮点击事件
        const folderButton = document.getElementById('folder-button');
        const fileListIframe = document.getElementById('file-list-iframe');
        let fileListVisible = false;

        folderButton.addEventListener('click', () => {
            if (!fileListVisible) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/file';
                form.target = 'file-list-iframe';
                const idField = document.createElement('input');
                idField.type = 'hidden';
                idField.name = 'id';
                idField.value = '{{.ServerID}}';
                form.appendChild(idField);
                const csrfMatch = document.cookie.match(new RegExp('(^| )nz-csrf=([^;]+)'));
                const csrfToken = csrfMatch ? decodeURIComponent(csrfMatch[2]) : '';
                if (csrfToken) {
                    const csrfField = document.createElement('input');
                    csrfField.type = 'hidden';
                    csrfField.name = '_csrf';
                    csrfField.value = csrfToken;
                    form.appendChild(csrfField);
                }
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
                fileListIframe.style.display = 'block';
                fileListVisible = true;
            } else {
                // 隐藏文件列表
                fileListIframe.style.display = 'none';
                fileListVisible = false;
            }
        });
    </script>
</body>

</html>
{{end}}
